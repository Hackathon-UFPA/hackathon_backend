<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ titulo }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:Arial,Helvetica,sans-serif;color:#222222;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:24px 0;">
<tr><td align="center">
<table role="presentation" width="560" cellpadding="0" cellspacing="0" style="background:#ffffff;max-width:560px;padding:32px;">
<tr><td>
<h1 style="font-size:20px;margin:0 0 16px 0;">{{ titulo }}</h1>
{% block conteudo %}{% endblock %}
{% if link %}
<p style="margin:24px 0;"><a href="{{ link }}" style="background:#1f4e79;color:#ffffff;padding:12px 20px;text-decoration:none;display:inline-block;">{{ texto_botao }}</a></p>
<p style="font-size:13px;color:#555555;">Se o botão não funcionar, copie e cole este endereço no navegador:<br>{{ link }}</p>
{% endif %}
<hr style="border:none;border-top:1px solid #dddddd;margin:24px 0 12px 0;">
<p style="font-size:12px;color:#777777;margin:0;">Mensagem automática do Hackathon UFPA. Não responda este e-mail.{% block rodape %}{% endblock %}</p>
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
