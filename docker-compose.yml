services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:11
    command: -connectRetries=10 -baselineOnMigrate=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db:
        condition: service_healthy

  # Banco usado só pelos testes (<POSTGRES_DB>_test), para o pytest nunca mexer nos dados de
  # desenvolvimento. Cria o banco se ele ainda não existir e termina.
  db_test:
    image: postgres:17
    entrypoint: ["sh", "-c"]
    command:
      - |
        psql -h db -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '$${POSTGRES_DB}_test'" | grep -q 1 \
          || createdb -h db "$${POSTGRES_DB}_test"
    environment:
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy

  flyway_test:
    image: flyway/flyway:11
    command: -connectRetries=10 -baselineOnMigrate=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}_test
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./migrations:/flyway/sql:ro
    depends_on:
      db_test:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: dev
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/code/app
      - ./tests:/code/tests
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      flyway_test:
        condition: service_completed_successfully

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT:-4040}:80"
    depends_on:
      - db

volumes:
  postgres_data:
